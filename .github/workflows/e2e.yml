name: e2e

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# wp-env runs WordPress in Docker, so the macOS named-volume mount bug that
# blocks local hermetic runs does not apply on the Linux runners.
jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      GRATORA_E2E_URL: http://localhost:8888
    steps:
      - name: Checkout core
        uses: actions/checkout@v4

      # The peer-to-peer add-on lives in a separate (private) repo. When it is
      # configured (repo var GRATORA_P2P_REPO + token secret GRATORA_P2P_TOKEN), pull
      # it in as a sibling so the P2P suite runs too; otherwise the run covers
      # core only.
      - name: Checkout gratora-p2p (optional)
        id: p2p
        if: vars.GRATORA_P2P_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GRATORA_P2P_REPO }}
          token: ${{ secrets.GRATORA_P2P_TOKEN }}
          ref: ${{ vars.GRATORA_P2P_REF || 'main' }}
          path: gratora-p2p

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # @gratora/ui is a public git dependency, but npm locks it as
      # ssh://git@github.com, which a runner has no key for: the install
      # then dies on "Permission denied (publickey)" before anything runs.
      # Rewrite it to https, which needs no credentials.
      - name: Fetch git dependencies over https
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Build core
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      - name: Build gratora-p2p
        if: vars.GRATORA_P2P_REPO != ''
        working-directory: gratora-p2p
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      # wp-env reads .wp-env.override.json on top of the committed core-only
      # .wp-env.json, so adding the add-on here keeps the default config clean.
      - name: Compose wp-env plugins
        if: vars.GRATORA_P2P_REPO != ''
        run: |
          printf '{ "plugins": [ ".", "%s/gratora-p2p" ] }\n' "$GITHUB_WORKSPACE" > .wp-env.override.json
          cat .wp-env.override.json

      - name: Start wp-env
        run: npx wp-env start

      # --yes because the seed asks before overwriting org money settings, and
      # a runner has no stdin: WP-CLI reads EOF, treats it as "no" and halts
      # with exit 0, so the step passes having seeded nothing.
      #
      # The seed is not in the release zip, so it is loaded from the checkout.
      # wp-env mounts the checkout under its folder name and runs commands from
      # the WordPress root, so --env-cwd is what makes the --require path resolve.
      - name: Seed core fixtures
        run: |
          PLUGIN_DIR="wp-content/plugins/$(basename "$GITHUB_WORKSPACE")"
          # The step runs under `bash -e`, so a failing seed would abort the
          # assignment before the echo and take its own explanation with it.
          set +e
          OUT="$(npx wp-env run cli --env-cwd="$PLUGIN_DIR" wp --require=tests-e2e/cli/E2eSeedCommand.php gratora e2e-seed --yes 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            echo "::error::the seed failed (exit $CODE). Its output is above."
            exit 1
          fi
          VARS="$(echo "$OUT" | grep -oE 'GRATORA_E2E_[A-Z_]+="[^"]*"' | sed -E 's/"//g' || true)"
          if [ -z "$VARS" ]; then
            echo "::error::the seed printed no GRATORA_E2E_* variables, so every spec would open / instead of the seeded form and time out waiting for it. See the seed output above."
            exit 1
          fi
          echo "$VARS" >> "$GITHUB_ENV"

      - name: Seed P2P fixtures
        if: vars.GRATORA_P2P_REPO != ''
        run: |
          # The step runs under `bash -e`, so a failing seed would abort the
          # assignment before the echo and take its own explanation with it.
          set +e
          OUT="$(npx wp-env run cli wp gratora-p2p e2e-seed 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            echo "::error::the P2P seed failed (exit $CODE). Its output is above."
            exit 1
          fi
          VARS="$(echo "$OUT" | grep -oE 'GRATORA_E2E_[A-Z_]+="[^"]*"' | sed -E 's/"//g' || true)"
          if [ -z "$VARS" ]; then
            echo "::error::the P2P seed printed no GRATORA_E2E_* variables. See the seed output above."
            exit 1
          fi
          echo "$VARS" >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
