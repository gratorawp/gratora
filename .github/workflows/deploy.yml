name: Deploy to WordPress.org

# Fires on a version tag, and can be run by hand at any time to watch it build
# the artefact without publishing anything.
#
# The artefact is NOT the git checkout. vendor/ and build/ are both gitignored,
# and dono.php requires vendor/autoload.php and action-scheduler at boot, so a
# deploy straight from a checkout ships a plugin that fatals the moment anyone
# activates it, with the admin screens blank behind it. Everything below exists
# to make sure that cannot happen quietly.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and inspect the artefact without publishing'
        type: boolean
        default: true

jobs:
  deploy:
    name: Build, verify, publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, gd, intl, zip, mbstring, dom, curl
          coverage: none
          tools: composer

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The tag is the only thing that says which version this is. If it
      # disagrees with the two places WordPress reads, the update either never
      # offers itself or offers the wrong thing, so stop here rather than
      # publish a mismatch.
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*?\s*Version:' dono.php | sed -E 's/.*Version:\s*//' | tr -d ' \r')
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/Stable tag:\s*//' | tr -d ' \r')
          echo "tag=$TAG header=$HEADER stable=$STABLE"
          test "$TAG" = "$HEADER" || { echo "::error::dono.php Version ($HEADER) does not match tag ($TAG)"; exit 1; }
          test "$TAG" = "$STABLE" || { echo "::error::readme.txt Stable tag ($STABLE) does not match tag ($TAG)"; exit 1; }

      # Strauss is a development dependency, and `strauss:auto` exits 0 when its
      # binary is absent. Installing --no-dev straight onto a fresh checkout
      # therefore produces no vendor/vendor-prefixed at all, and packaging stops
      # on the missing directory. Install with dev first so Strauss runs.
      - name: Install dependencies and run Strauss
        run: composer install --prefer-dist --no-progress

      # Production dependencies only. bin/package.mjs refuses to run while the
      # dev ones are present, so a missing --no-dev fails loudly rather than
      # shipping a 56 MB zip full of PHPUnit. vendor/vendor-prefixed is Strauss
      # output rather than a composer package, so it survives this.
      - name: Drop development dependencies
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      # @dono/ui is a public git dependency, but npm normalises a github:
      # spec to ssh://git@github.com, which a runner has no key for: the
      # install then dies on "Permission denied (publickey)" before anything
      # runs. Rewrite it to https, which needs no credentials.
      - name: Fetch git dependencies over https
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      # build/ is gitignored, and without it every admin screen renders nothing.
      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Package
        run: npm run package

      # Reading the artefact rather than trusting that it built. Each of these
      # has already been wrong once. Shared with build-zip.yml and runnable by
      # hand, so the release path is checked by the same code every other build
      # is checked by. It leaves the extracted tree at dist/dono, which the
      # publish step below uploads: the thing verified and the thing shipped are
      # the same bytes.
      - name: Verify the artefact
        run: bash bin/verify-zip.sh

      - name: Upload the artefact
        uses: actions/upload-artifact@v4
        with:
          name: dono-plugin
          path: dist/dono-fundraising-platform.zip

      # Only after everything above passed, and never on a dry run.
      - name: Publish to WordPress.org
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: dono-fundraising-platform
          BUILD_DIR: dist/dono-fundraising-platform
          VERSION: ${{ github.ref_name }}
          # The banner, icon and screenshots the plugin directory shows. These
          # live in SVN's assets/ rather than in the plugin, so without this
          # they are never published and the listing renders with a placeholder
          # icon and no screenshots, however many readme.txt declares.
          ASSETS_DIR: .wordpress-org
