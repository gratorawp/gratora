name: PHPUnit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The runs on the newest WordPress keep the name they had, in case a branch rule waits on it.
    name: Unit + Integration (${{ matrix.db.name }})${{ matrix.wp != 'latest' && format(' on WordPress {0}', matrix.wp) || '' }}
    runs-on: ubuntu-latest

    # Both engines, because they are not the same database. MariaDB has no JSON
    # type and rejects CAST(x AS JSON) as a syntax error, which reached a live
    # site as a white screen on every front-end page: the badge query runs on
    # wp_head. A suite that only ever meets MySQL cannot see that class of bug,
    # and most WordPress hosting is MariaDB.
    strategy:
      fail-fast: false
      matrix:
        db:
          - name: MySQL 8.0
            image: mysql:8.0
          - name: MariaDB 10.11
            image: mariadb:10.11
        # The newest WordPress and the oldest the plugin says it runs on. Only
        # the newest was tested once, and a floor nothing runs on is a guess.
        wp: [ latest, '6.9' ]

    services:
      mysql:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, gd, intl, zip, mbstring, dom, curl
          coverage: none
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      # composer.lock pins the test library of the newest WordPress. The older
      # one is tested with its own, so the library and the core under it agree.
      - name: Match the test library to WordPress ${{ matrix.wp }}
        if: matrix.wp != 'latest'
        run: composer require --dev --no-interaction --no-progress --update-with-dependencies "wp-phpunit/wp-phpunit:~${{ matrix.wp }}.0"

      # @gratora/ui is a public git dependency, but npm locks it as
      # ssh://git@github.com, which a runner has no key for: the install
      # then dies on "Permission denied (publickey)" before anything runs.
      # Rewrite it to https, which needs no credentials.
      - name: Fetch git dependencies over https
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      # The suite asserts on what the admin apps declare in their generated
      # index.asset.php, so build/ has to exist. It is gitignored, and without
      # this step those tests fail on a missing file rather than a real defect.
      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Provision WordPress test environment
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wp }}

      - name: Unit + integration suites
        run: composer test
