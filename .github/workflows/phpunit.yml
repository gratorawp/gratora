name: PHPUnit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit + Integration
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, gd, intl, zip, mbstring, dom, curl
          coverage: none
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      # The suite asserts on what the admin apps declare in their generated
      # index.asset.php, so build/ has to exist. It is gitignored, and without
      # this step those tests fail on a missing file rather than a real defect.
      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Provision WordPress test environment
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

      - name: Unit + integration suites
        run: composer test
